services:

  # ==================================================
  # POSTGRES
  # ==================================================

  postgres:
    image: postgres:16-alpine

    container_name: mtefop-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "${POSTGRES_HOST_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER} -d ${DB_NAME}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  # ==================================================
  # BACKEND
  # ==================================================

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: mtefop-backend

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      PORT: ${PORT}

      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}

    ports:
      - "${PORT}:5000"

    volumes:

      - ./backend:/app

      - backend_node_modules:/app/node_modules

     #Acces du backend au moteur docker de la machine
      - /var/run/docker.sock:/var/run/docker.sock

    command: npm run dev


  # ==================================================
  # FRONTEND
  # ==================================================

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: mtefop-frontend

    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app

      - frontend_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    command:
      [
        "npm",
        "run",
        "dev",
        "--",
        "--host",
        "0.0.0.0"
      ]
# ==================================================
# VOLUMES DOCKER
# ==================================================
volumes:
  postgres_data:
  backend_node_modules:
  frontend_node_modules: